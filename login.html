<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alamo Analytics — Acesso</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23E8751A'/><text y='72' x='50' text-anchor='middle' font-size='52' font-weight='700' fill='white' font-family='Arial'>AL</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0D2040;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.4)}
.logo-wrap{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-img-container{background:#0D2040;border-radius:10px;padding:5px 8px;display:flex;align-items:center}
.logo-img{height:30px;display:block}
.logo-text{font-size:18px;font-weight:700;color:#0D2040;letter-spacing:.5px}
.logo-sub{font-size:11px;color:#6b7a99;margin-top:2px}
.lock-icon{width:48px;height:48px;background:#fff8f3;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;border:2px solid #fde0c8}
.lock-icon svg{width:22px;height:22px;stroke:#E8751A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;font-weight:700;color:#0D2040;margin-bottom:6px}
.subtitle{font-size:13px;color:#6b7a99;margin-bottom:28px;line-height:1.5}
label{display:block;font-size:12px;font-weight:600;color:#1a2340;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field{margin-bottom:16px}
.input-wrap{position:relative}
input[type=email],input[type=password],input[type=text]{width:100%;padding:12px 44px 12px 14px;border:1.5px solid #e2e6ef;border-radius:10px;font-size:14px;color:#1a2340;background:#f8fafc;transition:border-color .15s;outline:none;font-family:inherit}
input:focus{border-color:#E8751A;background:#fff}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;font-size:16px;padding:4px;display:flex;align-items:center}
.eye-btn:hover{color:#E8751A}
.btn{width:100%;padding:13px;background:#E8751A;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;letter-spacing:.2px;margin-top:4px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:default}
.erro{display:none;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;color:#991b1b;margin-bottom:16px;align-items:center;gap:8px}
.erro.show{display:flex}
.ok{display:none;background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:10px 14px;font-size:13px;color:#15803d;margin-bottom:16px;align-items:center;gap:8px}
.ok.show{display:flex}
.footer{margin-top:24px;text-align:center;font-size:12px;color:#9ca3af}
.footer a{color:#E8751A;text-decoration:none;font-weight:600}
.footer a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#d1d5db;font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-img-container">
      <img src="logo-alamo.png" alt="Alamo" class="logo-img" onerror="this.parentElement.innerHTML='<span style=\'font-weight:800;font-size:15px;color:#fff;letter-spacing:-.5px\'>AL</span>'">
    </div>
    <div>
      <div class="logo-text">ÁLAMO ANALYTICS</div>
      <div class="logo-sub">Inteligência de Receita · Santos, SP</div>
    </div>
  </div>

  <div class="lock-icon">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>

  <h1>Área restrita</h1>
  <p class="subtitle">Entre com seu email e senha para acessar o dashboard.</p>

  <div class="erro" id="erro">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="erro-msg">Erro ao entrar.</span>
  </div>
  <div class="ok" id="ok-msg">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>
    <span id="ok-text"></span>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="senha">Senha</label>
    <div class="input-wrap">
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" class="eye-btn" onclick="toggleSenha()" title="Mostrar senha">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <button class="btn" id="btn" onclick="doLogin()">Entrar no Dashboard</button>

  <div class="divider">ou</div>
  <div class="footer">
    Não tem acesso? <a href="register.html">Solicitar cadastro</a>
  </div>
</div>

<script>
// Verifica se já está logado
(function(){
  const token=localStorage.getItem('alamo_token');
  if(token){
    try{
      const pay=JSON.parse(atob(token.split('.')[1]));
      if(pay.exp>Date.now()/1000){window.location='/';}
    }catch(e){}
  }
  // Mostra mensagens da URL
  const p=new URLSearchParams(location.search);
  if(p.get('registered')){showOk('Cadastro realizado! Aguarde a aprovação do administrador.');}
  if(p.get('expired')){showErro('Sessão expirada. Faça login novamente.');}
  if(p.get('logout')){showOk('Logout realizado com sucesso.');}
})();

function showErro(msg){
  document.getElementById('erro-msg').textContent=msg;
  document.getElementById('erro').classList.add('show');
  document.getElementById('ok-msg').classList.remove('show');
}
function showOk(msg){
  document.getElementById('ok-text').textContent=msg;
  document.getElementById('ok-msg').classList.add('show');
  document.getElementById('erro').classList.remove('show');
}

function toggleSenha(){
  const inp=document.getElementById('senha');
  const icon=document.getElementById('eye-icon');
  if(inp.type==='password'){
    inp.type='text';
    icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }else{
    inp.type='password';
    icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  const btn=document.getElementById('btn');

  if(!email||!senha){showErro('Preencha email e senha.');return;}

  btn.disabled=true;btn.textContent='Verificando...';

  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,senha})
    });
    const data=await r.json();

    if(!r.ok){
      showErro(data.error||'Erro ao entrar.');
      btn.disabled=false;btn.textContent='Entrar no Dashboard';
      return;
    }

    // Salva token
    localStorage.setItem('alamo_token',data.token);
    localStorage.setItem('alamo_nome',data.nome);
    localStorage.setItem('alamo_email',data.email);
    localStorage.setItem('alamo_role',data.role);

    // Cookie para middleware
    document.cookie=`alamo_token=${data.token};path=/;max-age=${60*60*24*7};SameSite=Strict`;

    window.location='/';
  }catch(err){
    showErro('Erro de conexão. Tente novamente.');
    btn.disabled=false;btn.textContent='Entrar no Dashboard';
  }
}

// Enter para logar
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
